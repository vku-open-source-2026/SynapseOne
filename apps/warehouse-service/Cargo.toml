[package]
name = "synapseone-warehouse"
version = "0.9.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Synapse Warehouse — tenant-scoped OLAP datasets, SQL queries and batch/stream ETL jobs"
publish = false

[[bin]]
name = "synapseone-warehouse"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
duckdb = { version = "=1.20000.2", features = ["bundled", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
