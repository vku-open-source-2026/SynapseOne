[package]
name = "synapseone-ocs"
version = "0.7.1"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "SynapseOCS bucket-aware object cloud storage (filesystem/S3) in Rust"
publish = false

[lib]
name = "synapseone_ocs"
path = "src/lib.rs"

[[bin]]
name = "synapseone-ocs"
path = "src/main.rs"

[[bin]]
name = "s3-backup"
path = "src/bin/s3-backup.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
