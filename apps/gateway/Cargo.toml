[package]
name = "synapseone-gateway"
version = "0.7.1"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "SynapseOne Tier-1 API gateway: JWT/API-key auth, central authorization, streaming reverse proxy"
publish = false

[[bin]]
name = "synapseone-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
regex = "1"
sha2 = "0.10"
futures-util = "0.3"
http-body = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
