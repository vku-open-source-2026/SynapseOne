;;
;; SynapseOne PgBouncer configuration.
;;
;; Transaction pooling multiplexes many short-lived application connections
;; onto a small number of Postgres backends. Session-scoped features (advisory
;; locks, LISTEN/NOTIFY, SET without LOCAL) must use DATABASE_DIRECT_URL; the
;; service migration/bootstrap code does exactly that.

[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /tmp/userlist.txt

; The default platform database role. If POSTGRES_USER is changed, update
; these two values (or operate the pooler through logs/metrics only).
admin_users = synapseone
stats_users = synapseone

pool_mode = transaction
max_client_conn = 500
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 60

; Allow drivers that use named prepared statements (for example sqlx) to work
; through transaction pooling. PgBouncer 1.21+ tracks and rewrites them.
max_prepared_statements = 200

server_connect_timeout = 5
server_login_retry = 2
server_idle_timeout = 60
server_lifetime = 3600
client_idle_timeout = 0
query_wait_timeout = 30

; node-postgres sends extra_float_digits on some versions; ignoring it keeps
; startup compatible without changing server/session state.
ignore_startup_parameters = extra_float_digits

stats_period = 60
log_connections = 0
log_disconnections = 0
