# SynapseOne alert rules (load via rule_files in prometheus.yml).
# Wire Alertmanager later; until then alerts show on the Prometheus /alerts page.
groups:
  - name: synapseone
    interval: 30s
    rules:
      - alert: GatewayDown
        expr: up{job="gateway"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "SynapseOne gateway is down"
          description: "Prometheus cannot scrape gateway:8080/metrics for >1m."

      - alert: BaseServiceDown
        expr: up{job="base"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "SynapseBase is down"
          description: "Prometheus cannot scrape base:4005/metrics for >2m."

      - alert: BaseOutboxBacklog
        expr: synapseone_base_outbox_pending > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "SynapseBase outbox is not draining"
          description: "Committed change events have not reached SynapseStream for >15m. Check STREAM_SERVICE_URL, Stream health, and synapseone_base_outbox attempts/last_error."

      - alert: BaseOutboxDeadLetter
        expr: synapseone_base_outbox_dead_lettered > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "SynapseBase outbox has quarantined events"
          description: "One or more change events exhausted retries or hit a permanent payload error. Inspect GET /internal/base/outbox and replay after fixing the cause."

      - alert: FaststoreDown
        expr: up{job="faststore"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Synapse Faststore is down"
          description: "Prometheus cannot scrape faststore:4006/metrics for >2m."

      - alert: QueueServiceDown
        expr: up{job="queue"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "SynapseQueue is down"
          description: "Prometheus cannot scrape queue:4007/metrics for >2m."

      - alert: LakehouseDown
        expr: up{job="lakehouse"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Synapse Lakehouse is down"
          description: "Prometheus cannot scrape lakehouse:4013/metrics for >2m. Iceberg commits and Warehouse materialization will fail."

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Postgres exporter is down"
          description: "postgres-exporter:9187 unreachable for >2m (check postgres + exporter)."

      - alert: ValkeyDown
        expr: up{job="valkey"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Valkey exporter is down"
          description: "valkey-exporter:9121 unreachable for >2m (check valkey + exporter)."
