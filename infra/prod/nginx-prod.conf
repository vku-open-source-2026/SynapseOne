# ---- HTTPS: console (@ + cloud) ----
server {
  listen 443 ssl;
  server_name @@DOMAIN@@ cloud.@@DOMAIN@@;

  ssl_certificate /etc/letsencrypt/live/@@DOMAIN@@/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/@@DOMAIN@@/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;
  client_max_body_size 1m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;

  location / {
    set $ui_upstream synapseone-console:80;
    proxy_pass http://$ui_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# ---- HTTPS: gateway API ----
server {
  listen 443 ssl;
  server_name api.@@DOMAIN@@;

  ssl_certificate /etc/letsencrypt/live/@@DOMAIN@@/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/@@DOMAIN@@/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;
  client_max_body_size 1m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Object uploads are presigned and go straight to SynapseOCS. Release
  # artifacts (APK/AAB) can be up to 128 MiB; keep every other API default at
  # 1 MiB. The signed URL is scoped to one tenant/bucket/key/method and still
  # terminates at the authenticated OCS route.
  location ^~ /v1/ocs/ {
    client_max_body_size 128m;
    proxy_request_buffering off;
    set $gw_upstream synapseone-gateway:8080;
    proxy_pass http://$gw_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
  }

  # Credential verification is a server-to-server hot path used by Tier-2 for
  # every request. It is not a password login endpoint; do not put it in the
  # brute-force auth bucket or a busy product will starve its own callers.
  location = /v1/auth/verify {
    set $gw_upstream synapseone-gateway:8080;
    proxy_pass http://$gw_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }

  # brute-force login/refresh: siet rieng o edge (xem docs/production.md)
  location /v1/auth/ {
    limit_req zone=auth burst=20 nodelay;
    set $gw_upstream synapseone-gateway:8080;
    proxy_pass http://$gw_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }

  location / {
    limit_req zone=api burst=100 nodelay;
    set $gw_upstream synapseone-gateway:8080;
    proxy_pass http://$gw_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }
}

# ---- HTTPS: data-contribution portal (OpenInfra GISTool) ----
server {
  listen 443 ssl;
  server_name contribution.synapsecity.sbs;

  ssl_certificate /etc/letsencrypt/live/@@DOMAIN@@/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/@@DOMAIN@@/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  client_max_body_size 25m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  location /api/ {
    set $contribution_api contribution-backend:8000;
    proxy_pass http://$contribution_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  location / {
    set $contribution_ui contribution-frontend:5173;
    proxy_pass http://$contribution_ui;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }
}
