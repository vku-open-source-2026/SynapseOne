# SynapseOne prod edge — nginx cho synapseone.space.
# Domain that bang @@DOMAIN@@ luc container start (xem entrypoint.sh).
# - synapseone.space + cloud.synapseone.space -> console:80 (frontend; @ la web chinh,
#   nut Dang nhap redirect ve cloud theo CONSOLE_APP_URL o runtime config.js)
# - api.synapseone.space -> gateway:8080 (API duy nhat public)
# - /.well-known/acme-challenge phuc vu certbot webroot (renew khong downtime)
# - rate-limit lop ngoai cho /v1/auth/* (gateway da go limiter noi tai)

# Upstreams resolve dynamically against Docker's embedded DNS (127.0.0.11) so
# a recreated console/gateway container (new IP) never leaves a stale upstream
# behind — redeploys need no edge restart.
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

# ---- HTTP: ACME challenge + redirect ve https ----
server {
  listen 80;
server_name @@DOMAIN@@ cloud.@@DOMAIN@@ api.@@DOMAIN@@ synapsedx.sbs cloud.synapsedx.sbs api.synapsedx.sbs synapsecity.sbs sos.synapsecity.sbs contribution.synapsecity.sbs;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

# ---- HTTPS: SynapseDX public API ----
server {
  listen 443 ssl;
  server_name api.synapsedx.sbs;

  ssl_certificate /etc/letsencrypt/live/@@DOMAIN@@/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/@@DOMAIN@@/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  client_max_body_size 25m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  location / {
    set $dx_upstream synapsedx-gateway:8080;
    proxy_pass http://$dx_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}

# ---- HTTPS: SynapseDX management console at the public root ----
