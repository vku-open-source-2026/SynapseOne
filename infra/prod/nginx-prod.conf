# ---- HTTPS: SynapseCity Tier-3 public product ----
server {
  listen 443 ssl;
  server_name synapsecity.sbs;

  ssl_certificate /etc/letsencrypt/live/@@DOMAIN@@/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/@@DOMAIN@@/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # Keep the public API paths on the Tier-3 gateway. The console calls
  # /health from the browser, so health must stay on this upstream too.
  location = /health {
    set $city_upstream synapsecity-gateway:8080;
    proxy_pass http://$city_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }

  location = /ready {
    set $city_upstream synapsecity-gateway:8080;
    proxy_pass http://$city_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }

  location ^~ /v1/ {
    set $city_upstream synapsecity-gateway:8080;
    proxy_pass http://$city_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }

  # The domain root and client-side routes belong to the Tier-3 console.
  location / {
    set $city_ui_upstream synapsecity-console:80;
    proxy_pass http://$city_ui_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

