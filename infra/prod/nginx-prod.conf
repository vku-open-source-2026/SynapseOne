    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
  location = /health {
    set $dx_upstream synapsedx-gateway:8080;
    proxy_pass http://$dx_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
  location = /ready {
    set $dx_upstream synapsedx-gateway:8080;
    proxy_pass http://$dx_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
  location / {
    set $dx_ui_upstream synapsedx-console:80;
