            - { name: CORS_ORIGIN, value: "https://console.example.com" }
            - { name: HSTS_ENABLED, value: "true" }
            - { name: OCS_PUBLIC_BASE_URL, value: "https://api.synapseone.space" }
          securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: "100m", memory: "128Mi" }, limits: { cpu: "500m", memory: "512Mi" } }
          livenessProbe: { httpGet: { path: /health, port: 4010 }, initialDelaySeconds: 10, periodSeconds: 20 }
          readinessProbe: { httpGet: { path: /health, port: 4010 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: ocs
  namespace: synapseone
spec:
  selector: { app: ocs }
  ports: [{ port: 4010, targetPort: 4010 }]
