            # Durable engine required in production (no memory fallback).
            - { name: STREAM_ENGINE, value: "valkey" }
            - { name: STREAM_VALKEY_URL, value: "redis://valkey:6379" }
            - { name: STREAM_REDIS_URL, value: "redis://valkey:6379" }
            - { name: SYNAPSEONE_INTERNAL_SECRET, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: internal-secret } } }
