            - { name: NODE_ENV, value: "production" }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: database-url } } }
            - { name: NOTIFICATIONS_QUEUE_URL, value: "http://queue:4007" }
            - { name: NOTIFICATIONS_QUEUE_NAME, value: "notifications" }
            - { name: SYNAPSEONE_INTERNAL_SECRET, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: internal-secret } } }
            - { name: CORS_ORIGIN, value: "https://console.example.com" }
            - { name: HSTS_ENABLED, value: "true" }
          securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: "100m", memory: "128Mi" }, limits: { cpu: "500m", memory: "512Mi" } }
          livenessProbe: { httpGet: { path: /health, port: 4011 }, initialDelaySeconds: 10, periodSeconds: 20 }
          readinessProbe: { httpGet: { path: /health, port: 4011 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
  namespace: synapseone
spec:
  selector: { app: notifications }
  ports: [{ port: 4011, targetPort: 4011 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: synapseone
spec:
  replicas: 1
  selector:
    matchLabels: { app: console }
  template:
    metadata:
      labels: { app: console }
    spec:
      containers:
        - name: console
          image: ghcr.io/synapseone/console:0.7.0
          ports: [{ containerPort: 80 }]
          env:
            # URL gateway ma TRINH DUYET goi toi (Ingress/TLS ben ngoai) - doi theo domain that.
            - { name: SYNAPSEONE_PUBLIC_BASE_URL, value: "https://gateway.example.com" }
            - { name: CONSOLE_APP_URL, value: "https://console.example.com" }
          securityContext: { runAsNonRoot: true, runAsUser: 101, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: "50m", memory: "64Mi" }, limits: { cpu: "250m", memory: "256Mi" } }
          livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5, periodSeconds: 20 }
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 3, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: synapseone
spec:
  selector: { app: console }
  ports: [{ port: 80, targetPort: 80 }]
