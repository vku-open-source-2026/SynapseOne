---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: warehouse-data
  namespace: synapseone
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse
  namespace: synapseone
spec:
  # One writer: DuckDB files and SynapseStream consumer groups are single-writer.
  replicas: 1
  selector:
    matchLabels: { app: warehouse }
  template:
    metadata:
      labels: { app: warehouse }
    spec:
      containers:
        - name: warehouse
          image: ghcr.io/synapseone/warehouse:0.9.0
          ports: [{ containerPort: 4012 }]
          env:
            - { name: PORT, value: "4012" }
            - { name: NODE_ENV, value: "production" }
            - { name: WAREHOUSE_DATA_DIR, value: "/data/warehouse" }
            - { name: WAREHOUSE_THREADS, value: "2" }
            - { name: STREAM_SERVICE_URL, value: "http://stream:4009" }
            - { name: SYNAPSEONE_INTERNAL_SECRET, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: internal-secret } } }
            - { name: CORS_ORIGIN, value: "https://console.example.com" }
          volumeMounts:
            - { name: warehouse-data, mountPath: /data/warehouse }
          securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: "200m", memory: "512Mi" }, limits: { cpu: "2000m", memory: "2Gi" } }
          livenessProbe: { httpGet: { path: /health, port: 4012 }, initialDelaySeconds: 20, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: 4012 }, initialDelaySeconds: 5, periodSeconds: 10 }
      volumes:
        - name: warehouse-data
          persistentVolumeClaim: { claimName: warehouse-data }
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse
  namespace: synapseone
spec:
  selector: { app: warehouse }
  ports: [{ port: 4012, targetPort: 4012 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: synapseone
spec:
  replicas: 2
  selector:
    matchLabels: { app: inference }
  template:
    metadata:
      labels: { app: inference }
    spec:
      containers:
        - name: inference
          image: ghcr.io/synapseone/inference:0.7.0
          ports: [{ containerPort: 4008 }]
          env:
            - { name: PORT, value: "4008" }
            - { name: NODE_ENV, value: "production" }
            - { name: CORS_ORIGIN, value: "https://console.example.com" }
            - { name: SYNAPSEONE_INTERNAL_SECRET, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: internal-secret } } }
            - { name: OPENROUTER_API_KEY, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: openrouter-api-key } } }
            - { name: OPENROUTER_MODEL, value: "liquid/lfm-2.5-2.6b:free" }
            - { name: INFERENCE_DEVICE, value: "cpu" }
            - { name: EMBEDDING_BACKEND, value: "auto" }
            - { name: EMBEDDING_BATCH_SIZE, value: "32" }
            - { name: EMBEDDING_MAX_LENGTH, value: "256" }
            - { name: INFERENCE_CPU_THREADS, value: "2" }
            - { name: DECISION_ENABLED, value: "true" }
            - { name: DECISION_THREADS, value: "2" }
            - { name: DECISION_WARMUP, value: "true" }
          securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: "500m", memory: "1Gi" }, limits: { cpu: "2000m", memory: "6Gi" } }
          livenessProbe: { httpGet: { path: /health, port: 4008 }, initialDelaySeconds: 30, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: 4008 }, initialDelaySeconds: 20, periodSeconds: 15 }
---
apiVersion: v1
