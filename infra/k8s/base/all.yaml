apiVersion: v1
kind: Namespace
metadata:
  name: synapseone
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
  namespace: synapseone
spec:
  replicas: 2
  selector:
    matchLabels: { app: iam }
  template:
    metadata:
      labels: { app: iam }
    spec:
      containers:
        - name: iam
          image: ghcr.io/synapseone/iam:0.7.0
          ports: [{ containerPort: 4001 }]
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: database-url } } }
            - { name: IAM_JWT_SECRET, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: iam-jwt-secret } } }
            - { name: IAM_API_KEY_PEPPER, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: api-key-pepper } } }
            - { name: SYNAPSEONE_INTERNAL_SECRET, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: internal-secret } } }
            - { name: VALKEY_URL, value: "redis://valkey:6379" }
            - { name: REDIS_URL, value: "redis://valkey:6379" }
            - { name: OIDC_ISSUER, value: "https://auth.example.com/application/o/synapseone/" }
            - { name: OIDC_CLIENT_ID, value: "synapseone-platform" }
            - { name: OIDC_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: oidc-client-secret } } }
            - { name: OIDC_REDIRECT_URI, value: "https://console.example.com/oidc/callback" }
            - { name: IAM_JWT_EXPIRES_IN, value: "3600" }
            # Production hardening (flip from dev defaults):
            - { name: NODE_ENV, value: "production" }
            - { name: IAM_ALLOW_DEV_LOGIN, value: "false" }
            - { name: IAM_ALLOW_OIDC_DEMO_CALLBACK, value: "false" }
            - { name: IAM_SENSITIVE_MUTATION_MODE, value: "enforce" }
            - { name: IAM_ALLOW_DIRECT_ORG_CREATE, value: "false" }
            - { name: PLATFORM_ADMIN_ENABLED, value: "true" }
            - { name: PLATFORM_ADMIN_REQUIRE_MFA, value: "true" }
            - { name: PLATFORM_ADMIN_REQUIRE_STEP_UP, value: "true" }
            - { name: PLATFORM_ORG_SLUG, value: "synapseone-platform" }
            - { name: PLATFORM_BOOTSTRAP_SECRET, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: platform-bootstrap-secret, optional: true } } }
            - { name: PLATFORM_RECOVERY_SECRET, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: platform-recovery-secret, optional: true } } }
            - { name: HSTS_ENABLED, value: "true" }
          securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: "100m", memory: "128Mi" }, limits: { cpu: "500m", memory: "512Mi" } }
          livenessProbe: { httpGet: { path: /health, port: 4001 }, initialDelaySeconds: 10, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /health, port: 4001 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: iam
  namespace: synapseone
spec:
  selector: { app: iam }
  ports: [{ port: 4001, targetPort: 4001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: synapseone
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/synapseone/gateway:0.7.1
          ports: [{ containerPort: 8080 }]
          env:
            - { name: IAM_SERVICE_URL, value: "http://iam:4001" }
            - { name: WORKFLOW_SERVICE_URL, value: "http://workflow:4002" }
            - { name: AI_SERVICE_URL, value: "http://ai:4003" }
            - { name: LDS_SERVICE_URL, value: "http://lds:4004" }
            - { name: BASE_SERVICE_URL, value: "http://base:4005" }
            - { name: FASTSTORE_SERVICE_URL, value: "http://faststore:4006" }
            - { name: QUEUE_SERVICE_URL, value: "http://queue:4007" }
            - { name: STREAM_SERVICE_URL, value: "http://stream:4009" }
            - { name: INFERENCE_SERVICE_URL, value: "http://inference:4008" }
            - { name: STORAGE_SERVICE_URL, value: "http://ocs:4010" }
            - { name: OCS_SERVICE_URL, value: "http://ocs:4010" }
            - { name: NOTIFICATIONS_SERVICE_URL, value: "http://notifications:4011" }
            # Gateway MUST share the JWT secret or every Bearer check fails closed.
            - { name: IAM_JWT_SECRET, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: iam-jwt-secret } } }
            - { name: SYNAPSEONE_INTERNAL_SECRET, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: internal-secret } } }
            - { name: NODE_ENV, value: "production" }
            - { name: HSTS_ENABLED, value: "true" }
            - { name: CORS_ORIGIN, value: "https://console.example.com" }
            - { name: GATEWAY_VERIFY_APIKEY, value: "true" }
            - { name: AUTHZ_MODE, value: "audit" }
            - { name: AUTHZ_MODE_REQUIRED, value: "true" }
            - { name: PROXY_TIMEOUT_MS, value: "30000" }
            # Trust exactly one hop (the Ingress controller) for client IPs.
            - { name: TRUST_PROXY, value: "1" }
          securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: "100m", memory: "128Mi" }, limits: { cpu: "500m", memory: "512Mi" } }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 15 }
          # readiness = aggregate /ready: chi nhan traffic khi iam + workflow deu len
          readinessProbe: { httpGet: { path: /ready, port: 8080 }, initialDelaySeconds: 15, periodSeconds: 15 }
---
# NOTE: gateway is the ONLY public entrypoint. Terminate TLS at Ingress
# (cert-manager) in front of this Service; do not expose IAM/workflow.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: synapseone
spec:
  type: LoadBalancer
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow
  namespace: synapseone
spec:
  replicas: 1
  selector:
    matchLabels: { app: workflow }
  template:
    metadata:
      labels: { app: workflow }
    spec:
      containers:
        - name: workflow
          image: ghcr.io/synapseone/workflow:0.7.0
          ports: [{ containerPort: 4002 }]
          env:
            - { name: SYNAPSEONE_INTERNAL_SECRET, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: internal-secret } } }
            - { name: IAM_SERVICE_URL, value: "http://iam:4001" }
            - { name: AUDIT_TRAIL, value: "true" }
            - { name: WORKFLOW_TIMEOUT_MS, value: "60000" }
            - { name: INFERENCE_TIMEOUT_MS, value: "120000" }
            - { name: NODE_ENV, value: "production" }
            - { name: HSTS_ENABLED, value: "true" }
            - { name: CORS_ORIGIN, value: "https://console.example.com" }
          securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: "100m", memory: "128Mi" }, limits: { cpu: "500m", memory: "512Mi" } }
          livenessProbe: { httpGet: { path: /health, port: 4002 }, initialDelaySeconds: 15, periodSeconds: 20 }
          readinessProbe: { httpGet: { path: /health, port: 4002 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: workflow
  namespace: synapseone
spec:
  selector: { app: workflow }
  ports: [{ port: 4002, targetPort: 4002 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: synapseone
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai }
  template:
    metadata:
      labels: { app: ai }
    spec:
      containers:
        - name: ai
          image: ghcr.io/synapseone/ai:0.7.0
          ports: [{ containerPort: 4003 }]
          env:
            - { name: AI_BASE_URL, value: "https://openrouter.ai/api/v1" }
            - { name: AI_API_KEY, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: ai-api-key } } }
            - { name: AI_DECISION_MODEL, value: "inception/mercury-2.5" }
            - { name: AI_LLM_MODEL, value: "liquid/lfm-2.5-2.6b:free" }
            - { name: AI_LLM_FALLBACK_MODEL, value: "inception/mercury-2.5" }
            - { name: AI_TIMEOUT_MS, value: "20000" }
            - { name: AI_RATE_LIMIT, value: "30" }
            - { name: AI_RETRIES, value: "2" }
            - { name: SYNAPSEONE_INTERNAL_SECRET, valueFrom: { secretKeyRef: { name: synapseone-secrets, key: internal-secret } } }
            - { name: IAM_SERVICE_URL, value: "http://iam:4001" }
            - { name: AUDIT_TRAIL, value: "true" }
            - { name: NODE_ENV, value: "production" }
            - { name: HSTS_ENABLED, value: "true" }
            - { name: CORS_ORIGIN, value: "https://console.example.com" }
          securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: "100m", memory: "128Mi" }, limits: { cpu: "500m", memory: "512Mi" } }
          livenessProbe: { httpGet: { path: /health, port: 4003 }, initialDelaySeconds: 15, periodSeconds: 20 }
          readinessProbe: { httpGet: { path: /health, port: 4003 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  namespace: synapseone
spec:
  selector: { app: ai }
  ports: [{ port: 4003, targetPort: 4003 }]
