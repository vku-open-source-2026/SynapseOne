apiVersion: v1
kind: Secret
metadata:
  name: synapseone-secrets
  namespace: synapseone
type: Opaque
stringData:
  # DÙNG CHO VÍ DỤ — production dùng SealedSecrets / External Secrets, không commit secret thật.
  database-url: postgres://synapseone:CHANGE_ME@postgres:5432/synapseone
  iam-jwt-secret: CHANGE_ME_32chars_min
  oidc-client-secret: CHANGE_ME
  # OpenAI-compatible LLM provider key (ai-service — server-side only).
  ai-api-key: CHANGE_ME
  # Shared service-to-service credential (gateway + iam + workflow + ai PHẢI trùng nhau).
  internal-secret: CHANGE_ME_32chars_min
  # One-time platform owner bootstrap / break-glass recovery (separate secrets).
  platform-bootstrap-secret: CHANGE_ME_32chars_min
  platform-recovery-secret: CHANGE_ME_32chars_min
  # HMAC pepper cho hash API-key/refresh-token lúc nghỉ.
  api-key-pepper: CHANGE_ME_32chars_min
  # Synapse Lakehouse catalog + storage (service-owned; never tenant credentials).
  lakehouse-catalog-uri: postgresql+pg8000://synapseone:CHANGE_ME@postgres:5432/synapseone
  lakehouse-warehouse: s3://synapseone-core/lakehouse
  lakehouse-s3-endpoint: http://s3:9090
  lakehouse-s3-access-key: CHANGE_ME
  lakehouse-s3-secret-key: CHANGE_ME
