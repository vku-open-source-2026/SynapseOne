name: ci

# CI cho moi nhanh TRU main (main do cd.yml phu trach: gate + publish dev npm/GHCR).
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call: # tai su dung lam gate cho cd.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - uses: actions/setup-go@v7
        with: { go-version: "1.22", cache: false }
      - run: npm ci --workspaces
      - run: npm run build --workspaces --if-present
      - run: npm run workflows:validate
      - run: npm run test --workspaces --if-present
      # Release identity: package/Cargo/image tags must match the workspace.
      - run: node tools/version-check.cjs
      - run: node tools/sdk-version-check.cjs
      - run: node --test tools/sdk-version-check.test.cjs
      - run: node --test tools/cd-workflow.test.cjs
      # API catalog drift gate (console try-it + AI agent + docs/api.md).
      - run: node tools/migration-check.mjs
      - run: node tools/catalog-check.mjs
      # Prod-dep audit: fails only on CRITICAL (the known HIGH `braces` advisory is
      # accepted + tracked in SECURITY.md — fix would be a breaking downgrade).
      # Root-level audit covers the whole workspace tree via the root lockfile.
      - run: npm audit --omit=dev --audit-level=critical
      # Copyleft gate (zero-dep script) + SBOM artifact.
      - run: node tools/license-check.cjs --sbom sbom.json
      - uses: actions/upload-artifact@v7
        with: { name: sbom, path: sbom.json }
      - run: go vet ./... && go test ./...
        working-directory: sdks/sdk-go
      - run: pip install "./sdks/sdk-python[dev]" && pip install pip-licenses && pip-licenses --fail-on="GPL;AGPL;LGPL"
      - run: pytest sdks/sdk-python -q
      # Inference service: install its requirements and run pytest (#34).
      # Failures block merge like every other workspace.
      - run: pip install -r apps/inference-service/requirements.txt
      - run: pytest apps/inference-service/tests -q
      - run: pip install -r apps/lakehouse-service/requirements.txt -r apps/lakehouse-service/requirements-dev.txt
      - run: pytest apps/lakehouse-service -q
      - run: ruff check sdks/sdk-python apps/inference-service && ruff format --check sdks/sdk-python apps/inference-service
      - name: Edge nginx config guard
        run: |
          if grep -RIn '^[[:space:]]*//' infra/prod/*.conf apps/console/nginx.conf; then
            echo 'nginx configs must use # comments, not //' >&2
            exit 1
          fi
      - run: docker compose config
  rust-services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [ai-service, base-service, queue-service, gateway, ocs-service, faststore-service, stream-service, lds-service, notifications-service]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --locked
        working-directory: apps/${{ matrix.service }}

  warehouse-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Link the official DuckDB 2.0.0 shared library instead of compiling the
      # bundled C++ engine; the URL and checksum are pinned in the Dockerfile.
      - name: Fetch pinned DuckDB 2.0.0
        run: |
          curl -fsSL -o /tmp/duckdb.tar.gz \
            https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-shared-libs-linux-amd64.tar.gz
          echo "993ad89e7dfca66cd6da994c2cad090c2fc160ddf9f550498a098ab4bb13cfb1  /tmp/duckdb.tar.gz" | sha256sum -c -
          mkdir -p /opt/duckdb && tar -xzf /tmp/duckdb.tar.gz -C /opt/duckdb
      - name: cargo test (dynamic DuckDB)
        run: cargo test --locked --no-default-features
        working-directory: apps/warehouse-service
        env:
          DUCKDB_LIB_DIR: /opt/duckdb
          LD_LIBRARY_PATH: /opt/duckdb

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build the control/data services that carry the release contract.
      # Inference/model images are built and published by their own release
      # pipeline; rebuilding the multi-GB model stack on every PR is not a gate.
      - run: docker compose build iam workflow queue base gateway console warehouse lakehouse stream ocs lds notifications
      - name: Build standalone DNS and Tunnel images
        run: |
          docker build -f apps/dns-service/Dockerfile -t synapseone-dns-service:ci .
          docker build -f apps/tunnel-service/Dockerfile -t synapseone-tunnel-service:ci .
      - name: Build self-hosted workflow runner image (CI fallback model stage)
        run: |
          docker build -f apps/workflow-runner/Dockerfile \
            --build-arg MODEL_STACK_IMAGE=python:3.11-slim-bookworm \
            -t synapseone-workflow-runner:ci .
  e2e-compose:
    runs-on: ubuntu-latest
    needs: build-test
    # Cold-cache image builds for the full stack can exceed an hour on busy
    # hosted runners; the suite itself runs in a few minutes after compose up.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - name: Free runner disk before the compose build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af --volumes || true
          df -h /
      - run: |
          cp .env.example .env
          # The e2e stack seeds no IAM policies; run the local transport with
          # central authz off. Production defaults to enforce via the prod overlay.
          sed -i 's/^AUTHZ_MODE=.*/AUTHZ_MODE=off/' .env
          sed -i 's/^AUTHZ_MODE_REQUIRED=.*/AUTHZ_MODE_REQUIRED=false/' .env
      - name: Compose up (single retry for transient registry/health failures)
        env:
          # The e2e suite uses a fake inference backend; skip the multi-GB
          # model/torch stack that the release pipeline builds separately.
          INFERENCE_INSTALL_MODELS: '0'
          INFERENCE_INSTALL_TORCH: '0'
          INFERENCE_PREFETCH_EMBEDDING: '0'
          # Hosted runners are memory/disk constrained; serialize image builds.
          COMPOSE_PARALLEL_LIMIT: '1'
        run: |
          set -e
          ok=0
          for attempt in 1 2; do
            echo "docker compose up — attempt ${attempt}"
            if docker compose up -d --build postgres valkey s3 s3-init iam workflow queue inference ocs gateway; then
              ok=1
              break
            fi
            echo "compose attempt ${attempt} failed; collecting diagnostics" >&2
            docker compose ps || true
            docker compose logs --tail=120 || true
            docker compose down -v || true
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "docker compose up failed after retry" >&2
            exit 1
          fi
      - run: |
          set -e
          for i in $(seq 1 36); do
            curl -sf http://localhost:8080/ready && break || sleep 5
          done
          curl -sf http://localhost:4001/health
          TOK=$(curl -s -XPOST http://localhost:8080/v1/auth/login -H'Content-Type: application/json' -d'{"email":"ci@acme.local","orgSlug":"acme"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['accessToken'])")
          curl -sf http://localhost:8080/v1/orgs -H"Authorization: Bearer $TOK" | grep -q acme
          curl -sf http://localhost:8080/v1/templates -H"Authorization: Bearer $TOK" | grep -q webhook-to-log
          echo E2E_OK
      - run: bash tests/e2e/api-check.sh
      - run: pip install ./sdks/sdk-python -q && SYNAPSEONE_BASE_URL=http://localhost:8080 python tests/e2e/sdk-check.py
      - name: Install workspaces
        run: npm ci --workspaces --no-audit --no-fund -q
      - name: Build workflow runner and JS SDK
        run: npm run build --workspace=apps/workflow-service --workspace=sdks/sdk-js -q
      - name: JS SDK e2e
        run: SYNAPSEONE_BASE_URL=http://localhost:8080 node tests/e2e/sdk-check.js
      - run: SYNAPSEONE_BASE_URL=http://localhost:8080 node tests/e2e/services-check.js
      - run: SYNAPSEONE_BASE_URL=http://localhost:8080 WORKFLOW_HEALTH_URL=http://localhost:4002/health node tests/e2e/workflow-runner-e2e.mjs
      - name: MCP docs e2e (public docs source only)
        env:
          # The template reads raw.githubusercontent.com; that is anonymous only
          # while the repository is public.
          E2E_MCP_DOCS_PUBLIC: ${{ github.event.repository.private == false }}
        run: SYNAPSEONE_BASE_URL=http://localhost:8080 node tests/e2e/mcp-docs-e2e.mjs
      - run: SYNAPSEONE_BASE_URL=http://localhost:8080 node tests/e2e/ocs-check.js
      # IAM integration nodes authenticate as the workflow service with a real
      # API key (the internal secret alone is not a caller identity).
      - name: Configure workflow IAM service key
        run: |
          set -euo pipefail
          BASE=http://localhost:8080
          TOK=$(curl -sf -XPOST "$BASE/v1/auth/login" -H'Content-Type: application/json' \
            -d '{"email":"ci@acme.local","orgSlug":"acme"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["accessToken"])')
          ORG=$(curl -sf "$BASE/v1/orgs" -H"Authorization: Bearer $TOK" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["id"])')
          ACC=$(curl -s -XPOST "$BASE/v1/orgs/$ORG/accounts" -H"Authorization: Bearer $TOK" \
            -H'Content-Type: application/json' -d '{"slug":"ci-workflow","displayName":"CI Workflow"}' \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("id") or d.get("account",{}).get("id",""))')
          if [ -z "$ACC" ]; then
            ACC=$(curl -sf "$BASE/v1/orgs/$ORG/accounts" -H"Authorization: Bearer $TOK" \
              | python3 -c 'import sys,json; print(next(a["id"] for a in json.load(sys.stdin) if a.get("slug")=="ci-workflow"))')
          fi
          KEY=$(curl -sf -XPOST "$BASE/v1/accounts/$ACC/keys" -H"Authorization: Bearer $TOK" \
            -H'Content-Type: application/json' -d '{"name":"workflow-showcase","scopes":["*"]}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["apiKey"])')
          test -n "$KEY"
          python3 - "$KEY" <<'PY'
          import pathlib, sys
          p = pathlib.Path('.env')
          lines = [l for l in p.read_text().splitlines() if not l.startswith('SYNAPSEONE_IAM_API_KEY=')]
          lines.append('SYNAPSEONE_IAM_API_KEY=' + sys.argv[1])
          p.write_text('\n'.join(lines) + '\n')
          PY
          docker compose up -d workflow
          for i in $(seq 1 30); do
            curl -sf http://localhost:4002/health && break || sleep 2
          done
          # Re-establish gateway -> workflow and prove every upstream is healthy
          # before the showcase starts.
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ready && break || sleep 2
          done
      # Complex-workflow showcase: Decision -> Base/Faststore/IAM/LDS/Queue/Flow
      # fan-out/fan-in. The AI lane is unit-tested; set SHOWCASE_RUN_AI=1 locally
      # with inference credentials to exercise it live.
      - run: SYNAPSEONE_BASE_URL=http://localhost:8080 node tests/e2e/workflow-showcase.mjs
      - run: docker compose down -v
        if: always()
