name: packages-visibility

# GitHub has no REST/GraphQL API to change GitHub Packages visibility. The
# only supported way is the package settings UI, once per package, by an
# organization owner:
#   Organization → Packages → <package> → Package settings
#     → Danger Zone → Change visibility → Public
#
# This workflow audits the current visibility so you know what still needs a
# click. It never fails the build for a private package.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Report package visibility
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          packages=(
            synapseone-gateway synapseone-iam synapseone-workflow synapseone-workflow-runner
            synapseone-ai synapseone-lds synapseone-base synapseone-faststore
            synapseone-queue synapseone-stream synapseone-inference synapseone-ocs
            synapseone-notifications synapseone-console synapseone-postgres synapseone-edge
          )
          private_count=0
          for pkg in "${packages[@]}"; do
            vis="$(gh api "/orgs/${OWNER}/packages/container/${pkg}" --jq '.visibility' 2>/dev/null || echo missing)"
            if [ "$vis" = "public" ]; then
              echo "public:  ${pkg}"
            else
              echo "::warning::${pkg} is ${vis}. Make it public once in Organization → Packages → ${pkg} → Package settings → Change visibility."
              private_count=$((private_count + 1))
            fi
          done
          echo "Private/missing packages: ${private_count}"
          echo "GitHub exposes no API to flip visibility; this is an org-owner UI action."
