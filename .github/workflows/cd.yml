name: cd

# CD cho main: gate (tai su dung ci.yml) + publish kenh DEV cho npm/GHCR.
# - npm:  <base>-dev.<run_number> voi dist-tag `dev` (`latest` giu cho release tag v*).
# - GHCR: tag `main` + `main-<sha>` (khong dung `latest`).
# PyPI chi publish ban stable tu release.yml khi push tag v* (khong publish dev).
# Bo qua publish cho commit docs/chore: them `[skip publish]` vao message.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# Publish phai tuan tu: khong cancel ban dang chay do (tranh publish do dang).
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 90
    if: "!contains(github.event.head_commit.message, '[skip publish]')"
    permissions:
      contents: read
      packages: write
      id-token: write # npm Trusted Publishing (OIDC, no token secret)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, registry-url: https://registry.npmjs.org }

      # Moi package lay dev version tu manifest cua chinh no (khong commit tro lai).
      - name: Compute dev versions
        id: ver
        run: |
          SDK_BASE=$(node -p "require('./sdks/sdk-js/package.json').version")
          CLI_BASE=$(node -p "require('./tools/cli/package.json').version")
          echo "sdk_version=${SDK_BASE}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "cli_version=${CLI_BASE}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stamp dev versions (workspace only, no commit)
        env:
          SDK_DEV: ${{ steps.ver.outputs.sdk_version }}
          CLI_DEV: ${{ steps.ver.outputs.cli_version }}
        run: |
          node -e "
            const fs = require('fs');
            const versions = {
              'sdks/sdk-js/package.json': process.env.SDK_DEV,
              'tools/cli/package.json': process.env.CLI_DEV,
            };
            for (const [file, version] of Object.entries(versions)) {
              const p = JSON.parse(fs.readFileSync(file, 'utf8'));
              p.version = version;
              fs.writeFileSync(file, JSON.stringify(p, null, 2) + '\n');
            }
          "
          grep -H '"version":' sdks/sdk-js/package.json tools/cli/package.json

      - run: npm install --workspace=sdks/sdk-js && npm run build --workspace=sdks/sdk-js
      - run: cp LICENSE sdks/sdk-js/LICENSE
      # Idempotent: skip packages whose exact version already exists (re-runs stay green).
      - name: Publish npm (sdk + cli, tag dev)
        env:
          SDK_DEV: ${{ steps.ver.outputs.sdk_version }}
          CLI_DEV: ${{ steps.ver.outputs.cli_version }}
        run: |
          set -euo pipefail
          publish_dev() {
            local pkg="$1" workspace="$2" version="$3"
            if npm view "@synapseone/${pkg}@${version}" version >/dev/null 2>&1; then
              echo "npm: @synapseone/${pkg}@${version} already published — skipping."
            else
              npm publish --workspace="${workspace}" --tag dev --access public
            fi
          }
          verify_dev() {
            local pkg="$1" version="$2" found
            for attempt in $(seq 1 60); do
              found=$(npm view "@synapseone/${pkg}@${version}" version 2>/dev/null || true)
              if [ "$found" = "$version" ]; then
                echo "npm registry verified @synapseone/${pkg}@${version}"
                return 0
              fi
              sleep 5
            done
            echo "npm registry did not expose @synapseone/${pkg}@${version} in time" >&2
            return 1
          }
          publish_dev sdk sdks/sdk-js "${SDK_DEV}"
          publish_dev cli tools/cli "${CLI_DEV}"
          verify_dev sdk "${SDK_DEV}"
          verify_dev cli "${CLI_DEV}"

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push images (main channel)
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          SHA="${{ steps.ver.outputs.sha }}"
          # Dev channel publishes the control-plane and edge services. The heavy
          # warehouse/inference/runner artifacts are published by the tagged
          # release pipeline, which has the model/toolchain build budget.
          for SVC in gateway iam workflow console dns tunnel; do
            case "$SVC" in
              gateway) CTX=apps/gateway ;;
              iam) CTX=apps/iam-service ;;
              workflow) CTX=apps/workflow-service ;;
              console) CTX=apps/console ;;
              dns) CTX=apps/dns-service ;;
              tunnel) CTX=apps/tunnel-service ;;
            esac
            echo "::group::build $SVC"
            df -h /
            # Every service Dockerfile copies from repo-root paths (apps/*,
            # LICENSE, licenses), so the build context must remain the root.
            docker build --progress=plain \
              --build-arg SOURCE_COMMIT="$SHA" \
              -f "$CTX/Dockerfile" \
              -t "ghcr.io/$OWNER/synapseone-$SVC:main" \
              -t "ghcr.io/$OWNER/synapseone-$SVC:main-$SHA" .
            test "$(docker image inspect "ghcr.io/$OWNER/synapseone-$SVC:main" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SHA"
            docker push "ghcr.io/$OWNER/synapseone-$SVC:main"
            docker push "ghcr.io/$OWNER/synapseone-$SVC:main-$SHA"
            docker manifest inspect "ghcr.io/$OWNER/synapseone-$SVC:main-$SHA" >/dev/null
            docker builder prune -f >/dev/null || true
            docker image prune -f >/dev/null || true
            echo "::endgroup::"
          done
          # The runner image bakes the inference model stack and is published by
          # the tagged release pipeline after that image exists. A main-channel
          # build here would either pull a missing local tag or ship a model-less
          # runner, so do not publish it here.
          echo "::notice::warehouse and workflow-runner are published by release.yml."

      - name: Summary
        run: |
          {
            echo "## CD (dev channel) — ${{ github.sha }}";
            echo "- npm: \`@synapseone/sdk@${{ steps.ver.outputs.sdk_version }}\`, \`@synapseone/cli@${{ steps.ver.outputs.cli_version }}\` (tag \`dev\`)";
            echo "- GHCR: \`ghcr.io/${{ github.repository_owner }}/synapseone-{gateway,iam,workflow,console,dns,tunnel}:main(-${{ steps.ver.outputs.sha }})\`";
            echo "- warehouse/workflow-runner: published by the tagged release pipeline.";
          } >> "$GITHUB_STEP_SUMMARY"
