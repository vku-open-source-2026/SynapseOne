name: publish-runner

# Standalone release channel for the self-hosted workflow runner. It keeps the
# runner image's :latest tag fresh without forcing a full platform release.
#
#   git tag runner-v0.9.1 && git push origin runner-v0.9.1
#
# The main CD workflow still publishes :main / :main-<sha> on every push.
on:
  workflow_dispatch:
  push:
    tags: ["runner-v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push runner image
        env:
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          TAGS=(
            -t "ghcr.io/${OWNER}/synapseone-workflow-runner:latest"
            -t "ghcr.io/${OWNER}/synapseone-workflow-runner:sha-${SHA}"
          )
          if [[ "${REF_NAME}" == runner-v* ]]; then
            TAGS+=(-t "ghcr.io/${OWNER}/synapseone-workflow-runner:${REF_NAME}")
          fi
          docker buildx build --push --provenance=true --sbom=true \
            "${TAGS[@]}" \
            -f apps/workflow-runner/Dockerfile \
            .
