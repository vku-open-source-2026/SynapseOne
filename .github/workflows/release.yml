name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, registry-url: https://registry.npmjs.org }
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: npm install --workspaces
      - run: npm run build --workspaces --if-present
      # Open-format release assets (tar.gz / whl / npm tgz — no zip/rar).
      - name: Build release assets
        run: |
          set -e
          mkdir -p release-assets
          npm pack --workspace=sdks/sdk-js --pack-destination release-assets
          npm pack --workspace=tools/cli --pack-destination release-assets
          pip install build >/dev/null
          python -m build sdks/sdk-python --outdir release-assets
          sha256sum release-assets/* > release-assets/SHA256SUMS
          ls -l release-assets
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*

  publish-images:
    runs-on: ubuntu-latest
    needs: release
    permissions: { packages: write, id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, attest and push every first-party image
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          SEMVER="${TAG#v}"
          for pair in \
            "gateway:apps/gateway" "iam:apps/iam-service" "workflow:apps/workflow-service" \
            "ai:apps/ai-service" "lds:apps/lds-service" "base:apps/base-service" \
            "faststore:apps/faststore-service" "queue:apps/queue-service" "stream:apps/stream-service" \
            "warehouse:apps/warehouse-service" \
            "inference:apps/inference-service" "ocs:apps/ocs-service" \
            "notifications:apps/notifications-service" "console:apps/console" \
            "postgres:infra/postgres" "edge:infra/prod"; do
            name="${pair%%:*}"
            context="${pair##*:}"
            docker buildx build --push --provenance=true --sbom=true \
              -t "ghcr.io/${OWNER}/synapseone-${name}:${TAG}" \
              -t "ghcr.io/${OWNER}/synapseone-${name}:${SEMVER}" \
              -t "ghcr.io/${OWNER}/synapseone-${name}:sha-${SHA}" \
              -t "ghcr.io/${OWNER}/synapseone-${name}:latest" \
              "${context}"
          done
          # Self-hosted workflow runner: shares the workflow engine source, so
          # its Dockerfile is built from the repository root context.
          docker buildx build --push --provenance=true --sbom=true \
            -f apps/workflow-runner/Dockerfile \
            -t "ghcr.io/${OWNER}/synapseone-workflow-runner:${TAG}" \
            -t "ghcr.io/${OWNER}/synapseone-workflow-runner:${SEMVER}" \
            -t "ghcr.io/${OWNER}/synapseone-workflow-runner:sha-${SHA}" \
            -t "ghcr.io/${OWNER}/synapseone-workflow-runner:latest" \
            .
      - name: Sign images with cosign (keyless)
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          for name in gateway iam workflow workflow-runner ai lds base faststore queue stream inference ocs notifications console postgres edge; do
            cosign sign --yes "ghcr.io/${OWNER}/synapseone-${name}:${TAG}"
            cosign sign --yes "ghcr.io/${OWNER}/synapseone-${name}:latest"
          done
      - name: GHCR visibility reminder
        run: |
          echo "::notice::GHCR packages are private by default. GitHub has no REST API to change package visibility; an org owner must set each package to Public once in Organization → Packages → <package> → Package settings → Change visibility."


  publish-sdk-js:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC, no token secret)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, registry-url: https://registry.npmjs.org }
      - run: npm install --workspace=sdks/sdk-js && npm run build --workspace=sdks/sdk-js
      - run: cp LICENSE sdks/sdk-js/LICENSE
      # Idempotent: skip when this exact version already exists (re-runs stay green).
      - run: |
          PKG_VER=$(node -p "require('./sdks/sdk-js/package.json').version")
          if npm view "@synapseone/sdk@$PKG_VER" version >/dev/null 2>&1; then
            echo "npm: @synapseone/sdk@$PKG_VER already published — skipping."
          else
            npm publish --workspace=sdks/sdk-js --access public
          fi

  publish-cli:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC, no token secret)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, registry-url: https://registry.npmjs.org }
      - run: cp LICENSE tools/cli/LICENSE 2>/dev/null || true
      # Idempotent: skip when this exact version already exists (re-runs stay green).
      - run: |
          PKG_VER=$(node -p "require('./tools/cli/package.json').version")
          if npm view "@synapseone/cli@$PKG_VER" version >/dev/null 2>&1; then
            echo "npm: @synapseone/cli@$PKG_VER already published — skipping."
          else
            npm publish --workspace=tools/cli --access public
          fi

  publish-sdk-python:
    # Stable PyPI releases only. The PyPI Trusted Publisher is configured for
    # this workflow (release.yml); cd.yml must not publish to PyPI.
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC, no token secret)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: pip install build
      - run: cp LICENSE sdks/sdk-python/LICENSE
      - run: python -m build sdks/sdk-python
      - name: Upload PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/sdk-python/dist/
          verbose: true
          skip-existing: true # re-runs stay green when the version already exists
