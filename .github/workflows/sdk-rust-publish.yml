name: Publish Rust SDK

# Operator-gated: add the CARGO_REGISTRY_TOKEN repository secret, then push a
# tag `sdk-rust-v<version>` (for example `sdk-rust-v0.10.2`). The tag version
# must match every SDK manifest. Re-running an already-published tag is a no-op,
# so release retries stay green.
on:
  push:
    tags:
      - 'sdk-rust-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SDK release tag matching this checkout (for example sdk-rust-v0.10.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-rust-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sdks/sdk-rust
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CRATE: synapseone
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/sdk-rust

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Verify shared SDK version and tag
        working-directory: .
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${RELEASE_TAG_INPUT}"
          fi
          TAG_COMMIT=$(git rev-parse --verify "${TAG}^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
            echo "::error::${TAG} points to ${TAG_COMMIT}, not checkout ${HEAD_COMMIT}."
            exit 1
          fi
          node tools/sdk-version-check.cjs "${TAG}"
          VERSION=$(cargo metadata --manifest-path sdks/sdk-rust/Cargo.toml \
            --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "Publishing ${CRATE} ${VERSION} from ${TAG}"

      - name: Check whether this version already exists
        id: check
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: SynapseOne-CI' \
            "https://crates.io/api/v1/crates/${CRATE}/${VERSION}")
          if [ "${STATUS}" = "200" ]; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "${CRATE} ${VERSION} is already published; skipping."
          elif [ "${STATUS}" = "404" ]; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::crates.io returned HTTP ${STATUS} while checking ${CRATE} ${VERSION}"
            exit 1
          fi

      - name: Require crates.io token
        if: steps.check.outputs.published != 'true'
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured for this repository."
            echo "::error::Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: cargo publish --locked

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.published }}" = "true" ]; then
            echo "### ${CRATE} ${VERSION} was already published" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### Published ${CRATE} ${VERSION}" >> "${GITHUB_STEP_SUMMARY}"
          fi
