name: synapsetunnel

services:
  tunnel:
    build:
      context: .
      dockerfile: apps/tunnel-service/Dockerfile
    image: ${SYNAPSETUNNEL_IMAGE:-synapse-migration/synapse-tunnel:latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      SYNAPSETUNNEL_HOST: 0.0.0.0
      SYNAPSETUNNEL_API_PORT: 4015
      SYNAPSETUNNEL_INGRESS_PORT: 4016
      SYNAPSETUNNEL_PUBLIC_SCHEME: ${SYNAPSETUNNEL_PUBLIC_SCHEME:-http}
      SYNAPSETUNNEL_PUBLIC_ORIGIN: ${SYNAPSETUNNEL_PUBLIC_ORIGIN:-}
      SYNAPSETUNNEL_DATA_FILE: /app/data/synapse-tunnel.json
      SYNAPSETUNNEL_ADMIN_TOKEN: ${SYNAPSETUNNEL_ADMIN_TOKEN:?set SYNAPSETUNNEL_ADMIN_TOKEN}
      SYNAPSEONE_INTERNAL_SECRET: ${SYNAPSEONE_INTERNAL_SECRET:-}
    ports:
      - "127.0.0.1:${SYNAPSETUNNEL_API_PORT:-4015}:4015"
      - "${SYNAPSETUNNEL_INGRESS_BIND_IP:-127.0.0.1}:${SYNAPSETUNNEL_INGRESS_PORT:-8082}:4016"
    volumes:
      - synapsetunnel-data:/app/data
    networks:
      synapseone-edge-net:
        aliases: [synapsetunnel]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4015/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  synapseone-edge-net:
    name: ${SYNAPSEONE_EDGE_NETWORK:-synapseone-edge-net}
    driver: bridge

volumes:
  synapsetunnel-data:
