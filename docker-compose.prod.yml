# Prod overlay cho synapseone.space (dung kem compose chinh):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Edge cong khai duy nhat: nginx :80/:443 (synapseone.space, cloud.*, api.* + LE).
# Moi service khac bind 127.0.0.1 qua .env (debug local), khong public.
# Authentik/s3/postgres/redis: chi trong network noi bo.

services:
  gateway:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
      GATEWAY_VERIFY_APIKEY: "true"
      # nginx is the only edge: one trusted proxy hop for the real client IP.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    networks:
      synapseone-net:
        aliases: [synapseone-gateway]

  iam:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
      IAM_ALLOW_DEV_LOGIN: "false"
      IAM_ALLOW_OIDC_DEMO_CALLBACK: "false"
      # Never echo reset/verification tokens on the public API.
      IAM_EXPOSE_LIFECYCLE_TOKENS: "false"
    # Unpublish internal API in prod (gateway-only access via docker network).
    # Requires Compose v2.24+ (!reset). Fallback is .env bind 127.0.0.1.
    ports: !reset []

  workflow:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
    ports: !reset []

  ai:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
    ports: !reset []

  lds:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
    ports: !reset []

  base:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
    ports: !reset []

  faststore:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
    ports: !reset []

  queue:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
    ports: !reset []

  stream:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
      # Durable engine + explicit CORS + internal secret (fail-closed at boot).
      STREAM_ENGINE: redis
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set in production}
      SYNAPSEONE_INTERNAL_SECRET: ${SYNAPSEONE_INTERNAL_SECRET:?SYNAPSEONE_INTERNAL_SECRET must be set in production}
    ports: !reset []

  notifications:
    environment:
      NODE_ENV: production
      HSTS_ENABLED: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-synapseone}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}@postgres:5432/${POSTGRES_DB:-synapseone}
      NOTIFICATIONS_QUEUE_URL: ${NOTIFICATIONS_QUEUE_URL:-http://queue:4007}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set in production}
      SYNAPSEONE_INTERNAL_SECRET: ${SYNAPSEONE_INTERNAL_SECRET:?SYNAPSEONE_INTERNAL_SECRET must be set in production}
    ports: !reset []

  ocs:
    environment:
      NODE_ENV: production
      OCS_PUBLIC_BASE_URL: ${OCS_PUBLIC_BASE_URL:-https://api.synapseone.space}
      HSTS_ENABLED: "true"
      STORAGE_BACKEND: s3
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://s3:9090}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:?STORAGE_S3_BUCKET must be set in production}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:?STORAGE_S3_ACCESS_KEY must be set in production}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:?STORAGE_S3_SECRET_KEY must be set in production}
      # Signed release uploads (APK/AAB) are larger than the 25 MiB API default;
      # the public edge allows this only on /v1/ocs/.
      STORAGE_MAX_OBJECT_BYTES: ${STORAGE_MAX_OBJECT_BYTES:-134217728}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set in production}
      SYNAPSEONE_INTERNAL_SECRET: ${SYNAPSEONE_INTERNAL_SECRET:?SYNAPSEONE_INTERNAL_SECRET must be set in production}
    ports: !reset []

  # Object storage (SeaweedFS, defined in docker-compose.yml): production
  # requires real credentials and keeps the S3 port off the host.
  s3:
    environment:
      S3_ADMIN_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:?STORAGE_S3_ACCESS_KEY must be set in production}
      S3_ADMIN_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:?STORAGE_S3_SECRET_KEY must be set in production}
    ports: !reset []

  s3-init:
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY:?STORAGE_S3_ACCESS_KEY must be set in production}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_KEY:?STORAGE_S3_SECRET_KEY must be set in production}
      S3_BUCKET: ${STORAGE_S3_BUCKET:?STORAGE_S3_BUCKET must be set in production}

  # Backups (pg-backup, s3-backup) are defined in docker-compose.yml.
  pg-backup:
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}

  inference:
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set in production}
      SYNAPSEONE_INTERNAL_SECRET: ${SYNAPSEONE_INTERNAL_SECRET:?SYNAPSEONE_INTERNAL_SECRET must be set in production}
    ports: !reset []

  prometheus:
    ports: !reset []

  console:
    environment:
      NODE_ENV: production
    networks:
      synapseone-net:
        aliases: [synapseone-console]

  # TLS terminator + Certbot webroot (renew khong downtime).
  nginx:
    build:
      context: ./infra/prod
    image: synapseone/edge:0.7.1
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-synapseone.space}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - gateway
      - console
    networks:
      synapseone-net:
      synapsedx-public-stack:
        aliases: [synapseone-edge]
      synapsecity-public-stack:
        aliases: [synapseone-edge]
      synapsecity-sos-public-stack:
        aliases: [synapseone-edge]

  certbot:
    image: certbot/certbot:latest
    restart: "no"
    # Entrypoint mac dinh cua image la `certbot`: `run --rm certbot certonly ...`
    # se thanh `certbot certonly ...`. Service thuong truc chi de giu volumes.
    entrypoint: ["certbot"]
    command: ["--version"]
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks: [synapseone-net]

volumes:
  certbot-www:
  letsencrypt:

networks:
  synapsedx-public-stack:
    external: true
  synapsecity-public-stack:
    external: true
  synapsecity-sos-public-stack:
    external: true
