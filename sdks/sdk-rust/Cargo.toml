[package]
name = "synapseone"
version = "0.9.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "Async Rust SDK for the SynapseOne platform gateway (Tier 1)"
repository = "https://github.com/vku-open-source-2026/SynapseOne"
homepage = "https://api.synapseone.space"
documentation = "https://docs.rs/synapseone"
readme = "README.md"
keywords = ["synapseone", "sdk", "api", "platform"]
categories = ["api-bindings", "asynchronous"]
authors = ["VKU.VIC <opensource@vku.vic>"]
include = ["src/**/*", "README.md", "LICENSE", "NOTICE", "Cargo.toml"]

[dependencies]
bytes = "1"
http = "1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
